<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mis objetivos</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --surface-2: #efeee9;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --border: rgba(11, 11, 11, 0.10);
  --accent: #2a78d6;
  --accent-soft: #cde2fb;
  --time: #b5b3ab;
  --good: #0ca30c;
  --good-ink: #006300;
  --bad: #d03b3b;
  --warn: #fab219;
  --comp: #c9c7bf;
  --shadow: 0 1px 2px rgba(11, 11, 11, 0.04), 0 4px 16px rgba(11, 11, 11, 0.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #262624;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --border: rgba(255, 255, 255, 0.10);
    --accent: #3987e5;
    --accent-soft: #1c3557;
    --time: #5a5955;
    --good-ink: #0ca30c;
    --comp: #4a4945;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --surface-2: #262624;
  --ink: #f0efec;
  --ink-2: #c3c2b7;
  --muted: #898781;
  --grid: #2c2c2a;
  --border: rgba(255, 255, 255, 0.10);
  --accent: #3987e5;
  --accent-soft: #1c3557;
  --time: #5a5955;
  --good-ink: #0ca30c;
  --comp: #4a4945;
  --shadow: none;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
main { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(32px + env(safe-area-inset-bottom)); }
h1 { font-size: 22px; line-height: 1.2; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 24px 2px 8px; }
h3 { font-size: 16px; margin: 0; line-height: 1.3; }
button { font: inherit; color: inherit; }
.sub { color: var(--ink-2); font-size: 14px; margin-top: 2px; }
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.icon-btn {
  border: 1px solid var(--border); background: var(--surface); border-radius: 10px;
  width: 40px; height: 40px; display: grid; place-items: center; cursor: pointer; flex: none;
}
.icon-btn svg { width: 18px; height: 18px; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
  padding: 14px; box-shadow: var(--shadow);
}
.card + .card { margin-top: 12px; }

/* Héroe */
.hero { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; align-items: center; margin-top: 16px; }
.hero-num { font-size: 44px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; }
.hero-lbl { font-size: 14px; color: var(--ink-2); }
.hero-lbl b { color: var(--ink); font-weight: 600; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 3px 9px;
  border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap;
}
.chip.warn::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }

/* Filas de preguntas */
.q { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; }
.q + .q { border-top: 1px solid var(--grid); }
.q-emoji { font-size: 20px; text-align: center; }
.q-title { font-weight: 600; font-size: 14px; }
.q-meta { color: var(--ink-2); font-size: 13px; }
.q-actions { display: flex; gap: 6px; }
.ans {
  border: 1px solid var(--border); background: var(--surface); border-radius: 10px;
  min-width: 44px; height: 40px; padding: 0 10px; cursor: pointer; font-weight: 600; font-size: 14px;
}
.ans.yes { color: var(--good-ink); }
.ans.no { color: var(--bad); }
.ans:active { transform: scale(0.97); }
.state { font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.state .dot { width: 10px; height: 10px; border-radius: 3px; }
.empty { color: var(--ink-2); font-size: 14px; padding: 6px 0; }

/* Objetivos */
.obj-head { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; }
.obj-emoji { font-size: 22px; line-height: 1.2; text-align: center; }
.obj-goal { color: var(--ink-2); font-size: 13px; margin-top: 2px; }
.metrics { margin: 14px 0 4px; display: grid; gap: 8px; }
.metric { display: grid; grid-template-columns: 104px 1fr 92px; gap: 10px; align-items: center; font-size: 13px; }
.metric .lbl { color: var(--ink-2); }
.metric .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.metric .val b { color: var(--ink); font-size: 15px; }
.bar { height: 10px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: 4px; }
.bar.time > span { background: var(--time); }
.bar.comp > span { background: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 2px; }

/* Calendario de calor */
.heat { margin-top: 14px; display: grid; gap: 3px; }
.heat .wk, .heat .dl { font-size: 10px; color: var(--muted); text-align: center; line-height: 14px; font-variant-numeric: tabular-nums; }
.heat .wk.cur { color: var(--ink); font-weight: 700; }
.heat .dl { text-align: left; }
.cell {
  aspect-ratio: 1; border-radius: 4px; border: 0; padding: 0; cursor: pointer; position: relative;
  background: var(--surface-2); display: grid; place-items: center; font-size: 11px; font-weight: 700; line-height: 1;
  min-width: 0;
}
.cell.out { visibility: hidden; pointer-events: none; }
.cell.free { background: transparent; box-shadow: inset 0 0 0 1px var(--grid); }
.cell.future { background: var(--surface-2); }
.cell.ok { background: var(--good); }
.cell.bad { background: var(--bad); color: #fff; }
.cell.bad::after { content: "×"; font-size: 13px; }
.cell.comp { background: var(--comp); }
.cell.pend { background: var(--surface); box-shadow: inset 0 0 0 2px var(--warn); }
.cell.pend::after { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--warn); }
.cell.today { outline: 2px solid var(--ink); outline-offset: 1px; }
.cell.full::before { content: ""; position: absolute; top: 2px; right: 2px; width: 5px; height: 5px; border-radius: 50%; background: var(--ink-2); }
.cell.full.ok::before, .cell.full.bad::before { background: #fff; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); margin: 2px 2px 0; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .cell { width: 14px; height: 14px; cursor: default; font-size: 9px; }
.legend .cell.bad::after { font-size: 11px; }
.legend .cell.pend::after { width: 4px; height: 4px; }

/* Ahorro */
.thermo { margin-top: 14px; }
.thermo-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.thermo-num { font-size: 28px; font-weight: 700; letter-spacing: -0.01em; }
.thermo-num small { font-size: 15px; font-weight: 500; color: var(--ink-2); }
.track { position: relative; height: 16px; border-radius: 5px; background: var(--surface-2); margin-top: 8px; }
.track .fill { position: absolute; inset: 0 auto 0 0; border-radius: 5px; background: var(--good); }
.track .proj { position: absolute; top: -4px; bottom: -4px; width: 0; border-left: 2px dashed var(--ink-2); }
.scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
.note { font-size: 13px; color: var(--ink-2); margin-top: 10px; }
.note b { color: var(--ink); }
.months { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 14px; }
.month { text-align: center; font-size: 11px; color: var(--ink-2); }
.month .cell { width: 100%; aspect-ratio: auto; height: 30px; margin-bottom: 4px; }
.month b { display: block; color: var(--ink); font-size: 11px; font-variant-numeric: tabular-nums; }

/* Hoja inferior */
.backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.35); z-index: 10; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; background: var(--surface);
  border-radius: 18px 18px 0 0; padding: 18px 16px calc(20px + env(safe-area-inset-bottom));
  max-width: 560px; margin: 0 auto; max-height: 85vh; overflow: auto; border: 1px solid var(--border);
}
.sheet h3 { font-size: 17px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
.seg button {
  border: 1px solid var(--border); background: var(--surface); border-radius: 10px; height: 44px;
  cursor: pointer; font-size: 14px; font-weight: 600;
}
.seg button[aria-pressed="true"].y { background: var(--good); border-color: var(--good); color: #fff; }
.seg button[aria-pressed="true"].n { background: var(--bad); border-color: var(--bad); color: #fff; }
.seg button[aria-pressed="true"].p { background: var(--surface-2); border-color: var(--ink-2); }
.seg button:disabled { opacity: 0.45; cursor: default; }
.field { display: grid; gap: 4px; margin-top: 12px; font-size: 13px; color: var(--ink-2); }
.field input {
  font: inherit; font-size: 16px; color: var(--ink); background: var(--page); border: 1px solid var(--border);
  border-radius: 10px; height: 44px; padding: 0 12px;
}
.primary {
  width: 100%; margin-top: 14px; height: 46px; border-radius: 12px; border: 0; cursor: pointer;
  background: var(--accent); color: #fff; font-weight: 600; font-size: 15px;
}
.ghost { width: 100%; margin-top: 8px; height: 44px; border-radius: 12px; border: 1px solid var(--border); background: transparent; cursor: pointer; }
.sheet-block { padding: 12px 0; }
.sheet-block + .sheet-block { border-top: 1px solid var(--grid); }
.msg { text-align: center; padding: 48px 16px; color: var(--ink-2); }
.msg b { color: var(--ink); display: block; font-size: 17px; margin-bottom: 6px; }
footer { margin-top: 20px; font-size: 12px; color: var(--muted); text-align: center; }
.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  background: var(--ink); color: var(--page); padding: 8px 14px; border-radius: 10px; font-size: 14px; z-index: 20;
}
@media (max-width: 360px) {
  .metric { grid-template-columns: 88px 1fr 84px; }
}
</style>
</head>
<body>
<main id="app"><div class="msg">Cargando…</div></main>
<script>
const API = "__API_BASE__";
const tgApp = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData ? window.Telegram.WebApp : null;
const nf = new Intl.NumberFormat("es-AR", { maximumFractionDigits: 0 });
const DIAS = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
const DCORTO = ["dom", "lun", "mar", "mié", "jue", "vie", "sáb"];
const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
const MCORTO = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
const START = "2026-11-02";
let S = null;

// ---------- Autenticación ----------
function dashKey() {
  const m = location.hash.match(/k=([A-Za-z0-9]+)/);
  if (m) {
    try { localStorage.setItem("dash_key", m[1]); } catch (e) {}
    history.replaceState(null, "", location.pathname + location.search);
    return m[1];
  }
  try { return localStorage.getItem("dash_key"); } catch (e) { return null; }
}
const KEY = tgApp ? null : dashKey();
function headers() {
  const h = { "Content-Type": "application/json" };
  if (tgApp) h["x-tg-init-data"] = tgApp.initData;
  else if (KEY) h["x-dash-key"] = KEY;
  return h;
}

// ---------- Utilidades de fechas ----------
const addDays = (d, n) => { const t = new Date(d + "T12:00:00Z"); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
const dow = (d) => new Date(d + "T12:00:00Z").getUTCDay();
const diff = (a, b) => Math.round((Date.parse(b + "T12:00:00Z") - Date.parse(a + "T12:00:00Z")) / 86400000);
const fmtShort = (d) => `${DCORTO[dow(d)]} ${d.slice(8, 10)}/${d.slice(5, 7)}`;
const fmtLong = (d) => { const s = DIAS[dow(d)]; return `${s[0].toUpperCase() + s.slice(1)} ${+d.slice(8, 10)} de ${MESES[+d.slice(5, 7) - 1]}`; };
const hhmm = (iso) => new Date(Date.parse(iso) - 3 * 3600000).toISOString().slice(11, 16);
const mondayOf = (d) => addDays(d, -((dow(d) + 6) % 7));
const ars = (n) => "AR$ " + nf.format(Math.round(n));
const usd = (n) => "USD " + nf.format(Math.round(n));
const pct = (x) => (x === null || x === undefined ? "—" : Math.round(x * 100) + "%");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---------- Datos ----------
async function load() {
  if (!tgApp && !KEY) return showMsg("Abre el dashboard desde el bot", "En Telegram, toca el botón «Dashboard» o escribe /dashboard.");
  try {
    const r = await fetch(API + "/api/state", { headers: headers() });
    if (r.status === 401) return showMsg("Acceso no autorizado", "Ábrelo desde el bot con /dashboard para obtener un enlace válido.");
    if (!r.ok) throw new Error("HTTP " + r.status);
    S = await r.json();
    render();
  } catch (e) {
    showMsg("No pude cargar los datos", "Revisa tu conexión y vuelve a intentar.", true);
  }
}
async function post(path, body) {
  const r = await fetch(API + path, { method: "POST", headers: headers(), body: JSON.stringify(body) });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
function showMsg(title, text, retry) {
  document.getElementById("app").innerHTML =
    `<div class="msg"><b>${esc(title)}</b>${esc(text)}${retry ? '<br><br><button class="ghost" style="max-width:200px" onclick="load()">Reintentar</button>' : ""}</div>`;
}
function toast(text) {
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = text; document.body.appendChild(t);
  setTimeout(() => t.remove(), 1800);
}
function haptic(kind) { try { tgApp && tgApp.HapticFeedback.notificationOccurred(kind); } catch (e) {} }

// ---------- Estados por día ----------
const obj = (id) => S.objectives.find((o) => o.id === id);
const checksOf = (id) => S.checks.filter((c) => c.objective_id === id);
function gymWeekSessions(day) {
  const m = mondayOf(day), end = addDays(m, 6);
  return S.checks.filter((c) => c.objective_id === "fisico" && c.status === "cumplido" && c.day >= m && c.day <= end).length;
}
function cellState(o, day) {
  if (day < o.start_date || day > o.end_date) return "out";
  const list = S.checks.filter((c) => c.objective_id === o.id && c.day === day);
  if (!list.length) return day > S.today ? "free" : "free";
  const c = list[0];
  if (c.status === "cumplido") return "ok";
  if (c.status === "no_cumplido") return o.id === "fisico" && gymWeekSessions(day) >= 3 ? "comp" : "bad";
  return c.overdue ? "pend" : "future";
}
const STATE_LABEL = { ok: "Cumplido", bad: "No cumplido", comp: "Compensado en la semana", pend: "Sin responder", future: "Por venir", free: "Sin meta ese día" };

// ---------- Render ----------
function render() {
  const st = S.stats;
  const g = st.general;
  const general = g.evaluados ? g.cumplidos / g.evaluados : null;
  const pend = S.checks.filter((c) => c.overdue && c.day < S.today);
  const hoy = S.checks.filter((c) => c.day === S.today).sort((a, b) => (a.notify_at || "").localeCompare(b.notify_at || ""));
  const html = [];

  html.push(`<div class="top"><div><h1>Mis objetivos</h1><div class="sub">Semana ${S.week} del reto · ${fmtLong(S.today)}</div></div>
    <button class="icon-btn" aria-label="Actualizar" onclick="load()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg></button></div>`);

  html.push(`<div class="hero"><div class="hero-num">${pct(general)}</div><div class="hero-lbl">Cumplimiento general<br><b>${g.cumplidos} de ${g.evaluados}</b> metas cumplidas${g.sinResponder ? ` · <span class="chip warn">${g.sinResponder} sin responder</span>` : ""}</div></div>`);

  if (pend.length) {
    html.push(`<h2>Sin responder</h2><div class="card">${pend.map(qRow).join("")}</div>`);
  }
  html.push(`<h2>Hoy</h2><div class="card">${hoy.length ? hoy.map(qRow).join("") : '<div class="empty">Hoy no hay metas con pregunta.</div>'}</div>`);

  html.push(`<h2>Objetivos</h2>`);
  html.push(legend());
  for (const o of S.objectives) html.push(o.id === "ahorro" ? ahorroCard(o) : objCard(o));

  const mep = S.mep && S.mep.venta ? `MEP ${ars(S.mep.venta)} · ` : "";
  html.push(`<footer>${mep}Actualizado ${hhmm(S.now)} hs</footer>`);
  document.getElementById("app").innerHTML = html.join("");
}

function qRow(c) {
  const o = obj(c.objective_id);
  const when = c.day === S.today ? (c.notify_at ? `${hhmm(c.notify_at)} hs` : "registro manual") : fmtShort(c.day);
  const title = `${esc(o.short)}${c.objective_id === "detox" ? " · Sem " + c.week : ""} <span class="q-meta">· ${when}</span>`;
  let right;
  if (c.status === "cumplido") right = `<span class="state" style="color:var(--good-ink)"><span class="dot" style="background:var(--good)"></span>Cumplido</span>`;
  else if (c.status === "no_cumplido") right = `<span class="state" style="color:var(--bad)"><span class="dot" style="background:var(--bad)"></span>No cumplido</span>`;
  else if (c.kind === "ahorro") right = `<div class="q-actions"><button class="ans" onclick="openDay('ahorro','${c.day}')">Cargar</button></div>`;
  else right = `<div class="q-actions"><button class="ans yes" aria-label="Cumplido" onclick="answer(${c.id},'cumplido')">✓</button><button class="ans no" aria-label="No cumplido" onclick="answer(${c.id},'no_cumplido')">✗</button></div>`;
  return `<div class="q"><div class="q-emoji">${o.emoji}</div><div><div class="q-title">${title}</div><div class="q-meta">${esc(c.meta)}</div></div>${right}</div>`;
}

function metricsHtml(s) {
  const frac = s.evaluados ? `(${s.cumplidos}/${s.evaluados})` : "";
  return `<div class="metrics">
    <div class="metric"><span class="lbl">Avance (tiempo)</span><div class="bar time"><span style="width:${(s.avance * 100).toFixed(1)}%"></span></div><span class="val"><b>${pct(s.avance)}</b></span></div>
    <div class="metric"><span class="lbl">Cumplimiento</span><div class="bar comp"><span style="width:${((s.cumplimiento || 0) * 100).toFixed(1)}%"></span></div><span class="val"><b>${pct(s.cumplimiento)}</b> ${frac}</span></div>
  </div>`;
}

function objCard(o) {
  const s = S.stats.byId[o.id];
  const chips = [];
  if (s.detalle) chips.push(`<span class="chip">${esc(s.detalle)}</span>`);
  if (o.id !== "ruso" && s.racha > 0) chips.push(`<span class="chip">🔥 racha ${s.racha}${o.id === "fisico" ? " sem" : ""}</span>`);
  if (s.sinResponder) chips.push(`<span class="chip warn">${s.sinResponder} sin responder</span>`);
  return `<div class="card"><div class="obj-head"><div class="obj-emoji">${o.emoji}</div><div><h3>${esc(o.name)}</h3><div class="obj-goal">${esc(o.goal)}</div></div></div>
    ${metricsHtml(s)}<div class="chips">${chips.join("")}</div>${heatmap(o)}
    ${o.id === "detox" ? '<div class="legend" style="margin-top:8px"><span><span class="cell future full"></span>Día sin fumar en todo el día (pregunta 22:30)</span></div>' : ""}</div>`;
}

function heatmap(o) {
  const weeks = Math.ceil((diff(START, o.end_date) + 1) / 7);
  const curW = Math.floor(diff(START, S.today) / 7) + 1;
  const out = [`<div class="heat" style="grid-template-columns: 14px repeat(${weeks}, minmax(0, 1fr))" role="grid" aria-label="Calendario de ${esc(o.short)}">`];
  out.push(`<span></span>`);
  for (let w = 1; w <= weeks; w++) out.push(`<span class="wk${w === curW ? " cur" : ""}">${w}</span>`);
  const labels = ["L", "M", "X", "J", "V", "S", "D"];
  for (let r = 0; r < 7; r++) {
    out.push(`<span class="dl">${labels[r]}</span>`);
    for (let w = 0; w < weeks; w++) {
      const day = addDays(START, w * 7 + r);
      const st = cellState(o, day);
      const full = o.id === "detox" && S.checks.some((c) => c.kind === "detox_dia" && c.day === day);
      const cls = `cell ${st}${full ? " full" : ""}${day === S.today ? " today" : ""}`;
      out.push(`<button class="${cls}" title="${fmtShort(day)} · ${STATE_LABEL[st] || ""}" aria-label="${fmtShort(day)}: ${STATE_LABEL[st] || ""}" onclick="openDay('${o.id}','${day}')"></button>`);
    }
  }
  out.push(`</div>`);
  return out.join("");
}

function legend() {
  const it = (cls, t) => `<span><span class="cell ${cls}"></span>${t}</span>`;
  return `<div class="legend" style="margin-bottom:10px">${it("ok", "Cumplido")}${it("bad", "No cumplido")}${it("pend", "Sin responder")}${it("comp", "Compensado")}${it("future", "Por venir")}${it("free", "Libre")}</div>`;
}

function ahorroCard(o) {
  const s = S.stats.byId.ahorro, a = S.stats.ahorro;
  const list = checksOf("ahorro").sort((x, y) => x.day.localeCompare(y.day));
  const u = a.usd || 0;
  const fillW = Math.min(u / 1000, 1) * 100;
  const projW = a.proyeccionUsd !== null ? Math.min(a.proyeccionUsd / 1000, 1) * 100 : null;
  const months = list.map((c, i) => {
    const st = c.status === "cumplido" ? "ok" : c.status === "no_cumplido" ? "bad" : c.overdue ? "pend" : "future";
    const monto = c.value && typeof c.value.monto === "number" ? nf.format(Math.round(c.value.monto / 1000)) + "k" : "—";
    const m = (c.value && c.value.mes) || i + 1;
    const label = MCORTO[(10 + m - 1) % 12];
    return `<div class="month"><button class="cell ${st}" aria-label="${label}: ${STATE_LABEL[st]}" onclick="openDay('ahorro','${c.day}')"></button>${label}<b>${monto}</b></div>`;
  }).join("");
  let note = "";
  if (S.mep && S.mep.venta) {
    note += `Con el piso de ${ars(200000)} en los ${a.restantes} aportes que quedan llegarías a <b>~${usd(a.proyeccionUsd)}</b> (sin intereses, al dólar de hoy).`;
    if (a.faltanArs > 0 && a.restantes > 0) note += ` Para llegar a USD 1.000 te faltan <b>${ars(a.faltanArs)}</b> ≈ ${ars(a.porMes)} por mes.`;
    if (a.faltanArs <= 0) note = `🎉 Ya alcanzaste los USD 1.000 al dólar de hoy.`;
  } else note = "No pude consultar el dólar MEP ahora; el avance en USD aparece cuando vuelva a estar disponible.";
  return `<div class="card"><div class="obj-head"><div class="obj-emoji">${o.emoji}</div><div><h3>${esc(o.name)}</h3><div class="obj-goal">${esc(o.goal)}</div></div></div>
    ${metricsHtml(s)}
    <div class="thermo"><div class="thermo-top"><div class="thermo-num">${usd(u)} <small>de 1.000</small></div><span class="chip">saldo ${ars(a.saldo)}</span></div>
      <div class="track" role="img" aria-label="${usd(u)} de USD 1.000"><div class="fill" style="width:${fillW}%"></div>${projW !== null ? `<div class="proj" style="left:${projW}%" title="Proyección: ${usd(a.proyeccionUsd)}"></div>` : ""}</div>
      <div class="scale"><span>0</span><span>250</span><span>500</span><span>750</span><span>1.000</span></div>
      <div class="note">${note}</div>
      <div class="legend" style="margin-top:6px"><span><span style="display:inline-block;width:0;height:12px;border-left:2px dashed var(--ink-2)"></span>Proyección con el piso</span></div>
    </div>
    <div class="months">${months}</div></div>`;
}

// ---------- Hoja de edición ----------
function closeSheet() { document.querySelectorAll(".backdrop,.sheet").forEach((e) => e.remove()); }
function openSheet(inner) {
  closeSheet();
  const b = document.createElement("div"); b.className = "backdrop"; b.onclick = closeSheet;
  const s = document.createElement("div"); s.className = "sheet"; s.setAttribute("role", "dialog"); s.innerHTML = inner;
  document.body.append(b, s);
}
function openDay(id, day) {
  const o = obj(id);
  const list = S.checks.filter((c) => c.objective_id === id && c.day === day);
  const future = day > S.today;
  const w = Math.floor(diff(START, day) / 7) + 1;
  const parts = [`<h3>${o.emoji} ${esc(o.short)} · ${fmtLong(day)}</h3><div class="sub">Semana ${w} del reto</div>`];
  if (!list.length) {
    if (id === "fisico" && !future) {
      parts.push(`<div class="sheet-block">No era día de gym programado. Si entrenaste, regístralo y cuenta para la meta semanal (esa semana: ${gymWeekSessions(day)}/3).
        <button class="primary" onclick="gym('${day}', true)">Registrar sesión</button></div>`);
    } else parts.push(`<div class="sheet-block empty">Ese día no tiene meta para este objetivo.</div>`);
  }
  for (const c of list) {
    const when = c.notify_at ? `pregunta ${hhmm(c.notify_at)} hs` : "registro manual";
    if (c.kind === "ahorro") {
      const v = c.value || {};
      parts.push(`<div class="sheet-block"><div class="q-meta">${esc(c.meta)} · ${when}</div>
        <label class="field">Monto invertido este mes<input id="f-monto" inputmode="numeric" placeholder="200000" value="${typeof v.monto === "number" ? v.monto : ""}"></label>
        <label class="field">Saldo total de la inversión hoy<input id="f-saldo" inputmode="numeric" placeholder="200000" value="${typeof v.saldo === "number" ? v.saldo : ""}"></label>
        ${future ? '<div class="note">Todavía no llega este cobro.</div>' : `<button class="primary" onclick="saveAhorro(${c.id})">Guardar</button>
        ${c.status !== "pendiente" ? `<button class="ghost" onclick="answer(${c.id},'pendiente')">Dejar sin responder</button>` : ""}`}</div>`);
      continue;
    }
    const extra = c.notify_at === null;
    parts.push(`<div class="sheet-block"><b>${esc(c.meta)}</b><div class="q-meta">${when}${future ? " · todavía no llega" : ""}</div>
      <div class="seg">
        <button class="y" aria-pressed="${c.status === "cumplido"}" ${future ? "disabled" : ""} onclick="answer(${c.id},'cumplido')">✓ Cumplido</button>
        <button class="n" aria-pressed="${c.status === "no_cumplido"}" ${future || extra ? "disabled" : ""} onclick="answer(${c.id},'no_cumplido')">✗ No</button>
        <button class="p" aria-pressed="${c.status === "pendiente"}" ${future ? "disabled" : ""} onclick="answer(${c.id},'pendiente')">Sin resp.</button>
      </div>
      ${extra ? `<button class="ghost" onclick="gym('${day}', false)">Quitar esta sesión extra</button>` : ""}</div>`);
  }
  if (id === "fisico" && !future) {
    const n = gymWeekSessions(day);
    const comp = list.some((c) => c.status === "no_cumplido") && n >= 3;
    parts.push(`<div class="note">Esa semana: ${n}/3 sesiones.${comp ? " Este día cuenta como <b>compensado</b>: igual llegaste a la meta semanal." : ""}</div>`);
  }
  parts.push(`<button class="ghost" onclick="closeSheet()">Cerrar</button>`);
  openSheet(parts.join(""));
}

async function answer(id, status) {
  try {
    await post("/api/answer", { id, status });
    haptic(status === "cumplido" ? "success" : "warning");
    closeSheet();
    toast(status === "cumplido" ? "Registrado ✓" : status === "no_cumplido" ? "Registrado" : "Marcado sin responder");
    await load();
  } catch (e) { toast("No se pudo guardar"); }
}
function num(v) {
  let t = String(v || "").trim().replace(/[$\s]|ars/gi, "");
  if (/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(t)) t = t.replace(/\./g, "").replace(",", ".");
  else t = t.replace(",", ".");
  const n = Number(t);
  return Number.isFinite(n) && t !== "" ? n : null;
}
async function saveAhorro(id) {
  const monto = num(document.getElementById("f-monto").value);
  const saldo = num(document.getElementById("f-saldo").value);
  if (monto === null || saldo === null) return toast("Completa ambos montos");
  try {
    await post("/api/answer", { id, status: monto >= 200000 ? "cumplido" : "no_cumplido", monto, saldo });
    haptic("success"); closeSheet(); toast(monto >= 200000 ? "Meta del mes cumplida ✓" : "Guardado (debajo del piso)");
    await load();
  } catch (e) { toast("No se pudo guardar"); }
}
async function gym(day, on) {
  try {
    await post("/api/gym", { day, on });
    haptic("success"); closeSheet(); toast(on ? "Sesión registrada 💪" : "Sesión quitada");
    await load();
  } catch (e) { toast("No se pudo guardar"); }
}

// ---------- Inicio ----------
if (tgApp) {
  tgApp.ready();
  tgApp.expand();
  document.documentElement.setAttribute("data-theme", tgApp.colorScheme === "dark" ? "dark" : "light");
  try {
    const bg = getComputedStyle(document.documentElement).getPropertyValue("--page").trim();
    tgApp.setHeaderColor(bg); tgApp.setBackgroundColor(bg);
  } catch (e) {}
}
load();
document.addEventListener("visibilitychange", () => { if (!document.hidden && S) load(); });
</script>
